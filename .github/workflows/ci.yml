name: Portfolio CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"

jobs:
  quality:
    name: portfolio-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install locked dependencies
        run: node .yarn/releases/yarn-1.22.22.cjs install --frozen-lockfile --non-interactive
      - name: Lint
        run: node .yarn/releases/yarn-1.22.22.cjs lint
      - name: Check types
        run: node .yarn/releases/yarn-1.22.22.cjs typecheck
      - name: Check pre-commit merge handling
        run: node .yarn/releases/yarn-1.22.22.cjs test:hooks

  site:
    name: portfolio-site (${{ matrix.environment }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        environment: [production, preview]
    env:
      VERCEL_ENV: ${{ matrix.environment }}
      PLAYWRIGHT_CHANNEL: chrome
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install locked dependencies
        run: node .yarn/releases/yarn-1.22.22.cjs install --frozen-lockfile --non-interactive
      - name: Check runner Chrome
        run: google-chrome --version
      - name: Build and prerender
        run: node .yarn/releases/yarn-1.22.22.cjs build
      - name: Check static output
        run: node .yarn/releases/yarn-1.22.22.cjs test
      - name: Test production browser behavior
        if: matrix.environment == 'production'
        run: node .yarn/releases/yarn-1.22.22.cjs test:e2e
      - name: Test preview indexing and metadata
        if: matrix.environment == 'preview'
        run: node .yarn/releases/yarn-1.22.22.cjs test:e2e tests/seo.spec.ts
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ matrix.environment }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  complete:
    name: portfolio-ci
    if: always()
    needs: [quality, site]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    env:
      QUALITY_RESULT: ${{ needs.quality.result }}
      SITE_RESULT: ${{ needs.site.result }}
    steps:
      - name: Require every validation job to succeed
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$SITE_RESULT" = "success"
